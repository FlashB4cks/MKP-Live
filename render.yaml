services:
  # 1. Backend Web Service (Django ASGI con Daphne y WebSockets)
  - type: web
    name: mkp-live-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT core.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Pega aquí tu URL de conexión de Supabase
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mkp-live-frontend.onrender.com"

  # 2. Frontend Static Site (React + Vite SPA)
  - type: web
    name: mkp-live-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://mkp-live-backend.onrender.com/api"
      - key: VITE_WS_URL
        value: "wss://mkp-live-backend.onrender.com"
